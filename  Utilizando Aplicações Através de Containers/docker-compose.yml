services:
  apache_service: #nome do servico (pode ser customizado)
    image: 'php:7.4-apache' #nome da imagem a ser utilizada como base
    container_name: container_php #nome do container
    restart: always #informa se o container devera ser 'restardado'
    ports:
      - '8099:80' #portas onde o servico rodara
    volumes:
      - '.:/var/www/html' #define e mapeia o volume
    depends_on:
      - mysql_service #opcional: informa se o servico depende de outro
    links:
      - mysql_service #opcional: linka o servico com outro servico  

  mysql_service: #nome do servico (pode ser customizado)
    image: mysql:5.7
    container_name: container_mysql
    restart: always
    ports:
      - '33079:3306'
    environment: #define algumas variaveis de ambiente
      - MYSQL_ROOT_PASSWORD=root 
      - MYSQL_DATABASE=biblioteca
      version: '3.8'

services:
  dbpostgres:
    image: 'postgres:latest'
    container_name: 'api_db'
    ports:
      - '54329:5432'
    restart: on-failure  
    environment:
      COMPOSE_PROJECT_NAME : ${COMPOSE_PROJECT_NAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "apirest", "-U", "user_bd" ]
      interval: 5s
      timeout: 5s
      retries: 15  
    networks:
      - api_node_postgres    

  backend:
    container_name: 'api_node'
    build:
      context: ../aplicacao
      dockerfile: ./dockerfiles/Node.Dockerfile
    ports:
      - '3099:3000'
    tty: true
    restart: on-failure 
    env_file:
        - .env
    environment:
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_USER: ${POSTGRES_USER}
      DB_NAME: ${POSTGRES_DB}
      DB_HOST: ${DOCKER_DB_HOST}
      DB_PORT: ${DB_PORT}
      FASTIFY_DB_DRIVER: ${FASTIFY_DB_DRIVER}
      FASTIFY_DB_DIALECT: ${FASTIFY_DB_DIALECT}
      FASTIFY_DB_QUERY_PARAMS: ${FASTIFY_DB_QUERY_PARAMS}
    links:
      - dbpostgres
    command: bash -c 'while !</dev/tcp/dbpostgres/5432; do sleep 1; done; npm run migrate; npm run seed; nodemon index.js'  
    depends_on:
      dbpostgres:
        condition: service_healthy
    networks:
      - api_node_postgres    

  frontend:
      container_name: frontend_react
      build:
        context: ../aplicacao
        dockerfile: ./dockerfiles/React.Dockerfile
      ports: 
        - "3097:5173"
      networks:
          - api_node_postgres  
      volumes: 
        - ./frontend/:/src/app
        - ./frontend/node_modules

volumes:
  data:
  
networks:
  api_node_postgres: 